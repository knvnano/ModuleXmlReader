name: Build and test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build ModuleXmlReader.Avalonia.sln -c Release --nologo
      - run: dotnet test ModuleXmlReader.Avalonia.sln -c Release --no-build --nologo
